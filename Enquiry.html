  <h1>Enquire from our Shop</h1>
  <p>Fill in the form below and we will get back to you about a product from our shop.</p>

  <form class="form" id="enquiry-form">
    <p id="enquiryResponse" style="color:green; font-weight:bold;"></p>
    <label for="name">Name *</label>
    <br>
    <input type="text" id="name" required>
    <small class="error" id="name-error"></small>
    <br>

    <label for="surname">Surname *</label>
    <br>
    <input type="text" id="surname" required>
    <small class="error" id="surname-error"></small>
    <br>

    <label for="email">Email *</label>
    <br>
    <input type="email" id="email" required>
    <small class="error" id="email-error"></small>
    <br>

    <label for="phone">Phone</label>
    <br>
    <input type="tel" id="phone">
    <small class="error" id="phone-error"></small>
    <br>

    <label for="product-category">Select Product Category *</label>
    <br>
    <select id="product-category" name="product-category" required>
      <option value="">--Please choose an option--</option>
      <option value="fresh-bouquets">Fresh Bouquets</option>
      <option value="flower-arrangements">Flower Arrangements</option>
      <option value="plants">Plants</option>
      <option value="gift-hampers">Gift Hampers</option>
      <option value="candles-self-care">Candles and Self-Care</option>
    </select>
    <small class="error" id="product-category-error"></small>
    <br>

    <label for="message">Your Message</label>
    <br>
    <textarea id="message" rows="4" placeholder="Tell us which product you want, colour, quantity and when you need it..."></textarea>
    <small class="error" id="message-error"></small>
    <br>

    <button type="submit">Send Enquiry</button>
  </form>
  <script src="script.js"></script>
</body>
